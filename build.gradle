plugins {
    id('java-library')
    id('idea')
    id('net.neoforged.moddev').version('2.0.141')
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

// Dev-only test driver (src/devcheck), never part of the release jar.
sourceSets {
    devcheck
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        inventorybuttons_devcheck {
            sourceSet(sourceSets.devcheck)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.named(mod_id).get()]
        }
        // ./gradlew runDevCheck : loads run-devcheck/saves/world, presses the buttons and takes screenshots
        devCheck {
            client()
            gameDirectory = file('run-devcheck')
            programArguments.addAll('--quickPlaySingleplayer', 'world')
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.devcheck)
dependencies {
    devcheckImplementation(sourceSets.main.output)
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


repositories {
    exclusiveContent {
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup('mezz.jei') }
    }
}

dependencies {
    // JEI is optional: we only compile against its API to keep JEI's overlays clear of the buttons.
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
}
